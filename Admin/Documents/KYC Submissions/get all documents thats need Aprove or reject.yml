info:
  name: get all documents thats need Aprove or reject
  type: http
  seq: 1
  tags:
    - Wathiq/Admin/Documents/kyc submissions

http:
  method: GET
  url: "{{URL}}/api/v1/admin/kyc/documents"
  auth:
    type: bearer
    token: "{{access_token_admin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
