info:
  name: List All Lawyer
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/api/v1/admin/lawyers?status=all"
  params:
    - name: status
      value: all
      type: query
  auth:
    type: bearer
    token: "{{admin_token_local}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
