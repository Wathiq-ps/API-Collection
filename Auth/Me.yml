info:
  name: Me
  type: http
  seq: 2
  tags:
    - Wathiq/Auth

http:
  method: GET
  url: "{{URL}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{access_token_user}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/api/v1/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
