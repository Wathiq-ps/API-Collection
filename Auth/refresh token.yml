info:
  name: refresh token
  type: http
  seq: 4
  tags:
    - Wathiq/Auth

http:
  method: POST
  url: "{{URL}}/auth/refresh"
  body:
    type: multipart-form
    data:
      - name: refresh_token
        type: text
        value: <<refresh_token>>
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/auth/refresh"
      method: POST
      body:
        type: multipart-form
        data:
          - name: refresh_token
            type: text
            value: <<refresh_token>>
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
