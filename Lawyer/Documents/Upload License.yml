info:
  name: Upload License
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/v1/lawyer/credentials"
  body:
    type: multipart-form
    data:
      - name: license_number
        type: text
        value: "15656891"
        contentType: date
        description: dd-mm-yyyy
      - name: bar_association
        type: text
        value: palestine
      - name: issued_at
        type: text
        value: 23-09-2026
      - name: expires_at
        type: text
        value: ""
        description: "optional "
      - name: document
        type: file
        value:
          - /mnt/sda5/Important/Me/me-small.jpg
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{lawyer_token_local}}"

runtime:
