info:
  name: Update Profile Image
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/api/v1/profile/image"
  body:
    type: multipart-form
    data:
      - name: profile_image
        type: file
        value:
          - /run/user/1000/doc/NIPX50oarHr_oscX1STBlA/توقيع.jpeg
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{access_token_user}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
