info:
  name: Create Property
  type: http
  seq: 1
  tags:
    - Wathiq/User/Properties/Owner

http:
  method: POST
  url: "{{URL}}/api/v1/properties"
  body:
    type: multipart-form
    data:
      - name: listing_type
        type: text
        value: sale
      - name: type
        type: text
        value: house
      - name: city
        type: text
        value: Gaza
      - name: district
        type: text
        value: ALRemal
      - name: building_number
        type: text
        value: "510"
      - name: latitude
        type: text
        value: "34.452184"
      - name: longitude
        type: text
        value: "31.517005"
      - name: area_sqm
        type: text
        value: "200"
      - name: price
        type: text
        value: "1000"
      - name: price_currency
        type: text
        value: USD
      - name: price_unit
        type: text
        value: ""
      - name: rooms
        type: text
        value: "4"
      - name: bathrooms
        type: text
        value: "2"
      - name: features[0]
        type: text
        value: parking
      - name: features[1]
        type: text
        value: garden
      - name: features[2]
        type: text
        value: water
      - name: is_furnished
        type: text
        value: "0"
      - name: description
        type: text
        value: this is for test
      - name: photos[0]
        type: file
        value: []
      - name: ownership_documents[0]
        type: file
        value: []
      - name: ownership_document_type
        type: text
        value: title_deed
  auth:
    type: bearer
    token: "{{access_token_user}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
